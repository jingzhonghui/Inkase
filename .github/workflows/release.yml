name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            build_cmd: pnpm run build:win:ci
            artifact_glob: |
              dist/*.exe
              dist/*.zip
              dist/latest*.yml
              dist/*.blockmap
          - os: ubuntu-latest
            name: linux
            build_cmd: pnpm run build:linux:ci
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb
              dist/latest*.yml
              dist/*.blockmap
          # macOS release packaging can be enabled later when signing/notarization is ready.
          # - os: macos-latest
          #   name: macos
          #   build_cmd: pnpm run build:mac:ci
          #   artifact_glob: |
          #     dist/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/ghc-* /usr/local/share/boost
          sudo apt-get clean
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Sync version from tag
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.version = process.env.GITHUB_REF_NAME.replace(/^v/, '')
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: ${{ matrix.build_cmd }}

      - name: Verify Linux Chromium sandbox permissions
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sandbox_path="dist/linux-unpacked/chrome-sandbox"
          test -f "$sandbox_path"
          test "$(stat -c '%a' "$sandbox_path")" = "4755"
          deb_path="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_path"
          deb_mode="$(dpkg-deb -c "$deb_path" | awk '/chrome-sandbox$/ {print $1}')"
          test "$deb_mode" = "-rwsr-xr-x"
          control_dir="$(mktemp -d)"
          dpkg-deb -e "$deb_path" "$control_dir"
          grep -q "chmod 4755" "$control_dir/postinst"
          ! grep -q "chmod 0755" "$control_dir/postinst"
          ! grep -q "unshare" "$control_dir/postinst"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-release
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -maxdepth 3 -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          {
            echo '## Release published successfully'
            echo ''
            echo "Tag: ${{ github.ref_name }}"
            echo 'Assets uploaded from the `dist/` directory.'
          } >> "$GITHUB_STEP_SUMMARY"

  # 官网部署刻意不在这里做：本工作流由 tag 触发，跑在 refs/tags/* 上，
  # 而 github-pages 环境的 Deployment branches and tags 只放行默认分支，
  # 直接 job 调用 deploy-site.yml 会被服务端拒绝（Tag "vX.Y.Z" is not allowed
  # to deploy to github-pages）。改由 website.yml 的 workflow_run 触发，
  # 那次运行落在 master 上，环境规则自然满足 —— 见 website.yml 顶部说明。
